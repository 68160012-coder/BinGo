<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งจุดขยะ - BinGo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">🗑️ BinGo</a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">สถิติ</a>
                <a href="report.html" class="nav-link active">แจ้งจุดขยะ</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- === REPORT SECTION === -->
        <section id="report-section" class="page-section">
            
            <!-- Form Panel -->
            <div class="panel form-panel">
                <h2 class="panel-title">📍 พบเจอขยะ? แจ้งได้เลย</h2>
                <form id="report-form" novalidate>
                    <div class="form-group">
                        <label for="location">สถานที่ *</label>
                        <input type="text" id="location" name="location" required 
                               minlength="3" maxlength="100" placeholder="เช่น ชายหาดบางแสน ซอย 4">
                    </div>

                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="waste_type">ประเภทขยะ *</label>
                            <select id="waste_type" name="waste_type" required>
                                <option value="" disabled selected>-- เลือก --</option>
                                <option value="general">ขยะทั่วไป</option>
                                <option value="recyclable">ขยะรีไซเคิล</option>
                                <option value="organic">ขยะอินทรีย์</option>
                                <option value="hazardous">ขยะอันตราย</option>
                            </select>
                        </div>
                        <div class="form-group flex-1">
                            <label for="amount_kg">น้ำหนัก (กก.) *</label>
                            <input type="number" id="amount_kg" name="amount_kg" required 
                                   min="1" max="1000" placeholder="1-1000">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="detail">รายละเอียดเพิ่มเติม</label>
                        <textarea id="detail" name="detail" rows="3" 
                                  maxlength="500" placeholder="ลักษณะขยะ หรือจุดสังเกต..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">ส่งข้อมูล</button>
                    
                    <div id="form-success" class="alert alert-success hidden"></div>
                    <div id="form-error" class="alert alert-error hidden"></div>
                </form>
            </div>

            <!-- Reports List -->
            <div class="list-section">
                <div class="list-header">
                    <h2 class="panel-title">รายการแจ้งล่าสุด</h2>
                    <div class="filter-wrap">
                        <label for="filter-type" class="sr-only">กรอง</label>
                        <select id="filter-type" class="filter-select">
                            <option value="">ทั้งหมด</option>
                            <option value="general">ขยะทั่วไป</option>
                            <option value="recyclable">รีไซเคิล</option>
                            <option value="organic">อินทรีย์</option>
                            <option value="hazardous">อันตราย</option>
                        </select>
                    </div>
                </div>

                <div id="reports-loading" class="loading-state compact">
                    <div class="spinner small"></div>
                    <span>กำลังโหลด...</span>
                </div>
                
                <div id="reports-list" class="reports-grid hidden"></div>
                <div id="reports-empty" class="empty-state hidden">
                    <span class="empty-icon">📭</span>
                    <p>ยังไม่มีรายการแจ้งขยะ</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 2026 BinGo Waste Management</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
